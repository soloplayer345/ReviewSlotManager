services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rsm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ReviewSlotManager/Dockerfile
    container_name: rsm-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnectionString: "Server=sqlserver,1433;Database=ReviewSlotManager;User ID=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;Encrypt=false"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sqlserver-data:
